services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hookline
      POSTGRES_USER: hookline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookline -d hookline"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      ConnectionStrings__Hookline: Host=postgres;Database=hookline;Username=hookline;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: