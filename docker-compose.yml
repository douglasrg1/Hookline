name: hookline

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hookline
      POSTGRES_USER: hookline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5433 on the host, so Hookline can run alongside other local PostgreSQL instances.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookline -d hookline"]
      interval: 5s
      retries: 10

  api:
    build: .
    # A small init process runs as PID 1. Without it, the kernel ignores the abort signal .NET raises
    # on an unhandled exception, and a failed startup keeps the container running at full CPU.
    init: true
    environment:
      ConnectionStrings__Hookline: Host=postgres;Database=hookline;Username=hookline;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Database__ApplyMigrationsOnStartup: "true"
      Auth__OrganizationKey: ${AUTH_ORGANIZATION_KEY}
      Encryption__Key: ${ENCRYPTION_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: